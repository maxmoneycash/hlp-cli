<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hlp vault</title>
<style>
:root{--bg:#0e0f0f;--surface:#121212;--line:#232526;--text:#f4f3ef;--muted:#8a8a8f;--accent:#97fce4;--up:#3ddc97;--down:#ff5c7a;
  font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
:root[data-theme=light]{--bg:#f7f6f2;--surface:#ffffff;--line:#e3e1da;--text:#16171a;--muted:#6d6a62;--accent:#127a63;--up:#14895a;--down:#c0362c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.card{padding:14px 12px 12px}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.name{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.badge.warn{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.badge.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.hero{display:flex;align-items:flex-end;gap:20px;margin:14px 0 8px;flex-wrap:wrap}
.big{font:600 24px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.lbl{color:var(--muted);font-size:11px;margin-bottom:4px}
.up{color:var(--up)}.down{color:var(--down)}
.spark{line-height:0;margin:4px 0 12px}
.spark svg{width:100%;height:96px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grid div{background:var(--surface);padding:8px 10px}
.grid .v{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
th{color:var(--muted);font-weight:500;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.foot{margin-top:10px;color:var(--muted);font-size:11px}
.empty{padding:28px 12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card" id="app"><div class="empty">Waiting for vault data…</div></div>
<script>
/*@BRIDGE@*/
(() => {
  const { el, fmt } = hlp;
  const app = document.getElementById("app");
  const DAY = 864e5;

  // Two shapes: get_vault (domain.VaultDetail) and get_strategy_vault
  // (pvault.Tearsheet). Normalize to one tearsheet model.
  function model(d, meta) {
    if (d.summary) {
      const s = d.summary, m = (d.tearsheet && d.tearsheet.metrics) || {};
      const pos = ((d.account && d.account.positions) || []).map((p) => ({ coin: p.coin, size: p.size, value: p.value, upnl: p.upnl, lev: p.leverage }));
      return {
        name: s.name || s.address, who: "leader " + short(s.leader), kind: s.kind,
        tvl: s.tvl, price: d.sharePrice, priceLabel: "share price",
        updated: s.updatedAt || meta.asOf, stale: s.stale || meta.stale, curated: s.curated, closed: s.closed,
        ret: m.totalReturn != null ? m.totalReturn : (s.returns && s.returns.all),
        metrics: [["APR", fmt.pct(s.apr)], ["sharpe", fmt.num(s.sharpe)],
          ["sharpe (daily)", m.sharpe != null ? fmt.num(m.sharpe) : "–"], ["max drawdown", fmt.pct(m.maxDD != null ? m.maxDD : s.maxDD)],
          ["volatility", fmt.pct(m.vol)], ["age", s.ageDays ? s.ageDays + "d" : "–"],
          ["capacity", d.capacityUsd < 0 ? "unlimited" : fmt.usd(d.capacityUsd)], ["followers", s.followers || "–"]],
        positions: pos,
      };
    }
    const pos = (d.positions || []).map((p) => ({ coin: p.coin, size: p.size, value: p.positionValueUsd, upnl: p.unrealizedPnlUsd, lev: p.leverage }));
    return {
      name: d.name || d.vault, who: (d.testnet ? "testnet" : "HyperEVM") + " · epoch " + d.epoch + " · " + (d.phase || ""),
      kind: "strategy", tvl: d.navUsd, price: d.sharePrice, priceLabel: "share price",
      updated: meta.asOf, stale: meta.stale, paused: d.paused,
      ret: d.returnSinceLaunch,
      metrics: [["since launch", fmt.pct(d.returnSinceLaunch, 2)], ["vs high-water", fmt.pct(d.drawdownVsHwm, 2)],
        ["deployed", fmt.pct(d.deployedPct, 0)], ["idle", fmt.usd(d.idleUsd)],
        ["pending in", fmt.usd(d.pendingDepositsUsd)], ["perp equity", fmt.usd(d.corePerpEquityUsd)]],
      positions: pos,
    };
  }
  const short = (a) => (a && a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : a || "");

  function render(result) {
    const { data = {}, meta = {} } = hlp.env(result);
    const v = model(data, meta);
    const age = Date.now() - Date.parse(v.updated || "");
    const stale = v.stale || age > DAY;
    const badges = [
      v.kind && el("span", { class: "badge" }, v.kind),
      v.curated && el("span", { class: "badge ok" }, "curated"),
      v.closed && el("span", { class: "badge warn" }, "closed"),
      v.paused && el("span", { class: "badge warn" }, "paused"),
      stale && el("span", { class: "badge warn", title: "older than 24 h" }, "stale " + fmt.ago(v.updated)),
    ];
    const spark = hlp.svg(data.sparkSvg);
    const rows = v.positions.slice(0, 8);
    app.replaceChildren(
      el("div", { class: "name" }, v.name),
      el("div", { class: "sub" }, el("span", null, v.who), ...badges),
      el("div", { class: "hero" },
        el("div", null, el("div", { class: "lbl" }, "TVL"), el("div", { class: "big" }, fmt.usd(v.tvl))),
        el("div", null, el("div", { class: "lbl" }, v.priceLabel), el("div", { class: "big" }, v.price ? fmt.num(v.price, 4) : "–")),
        v.ret != null && el("div", null, el("div", { class: "lbl" }, "return"),
          el("div", { class: "big " + (v.ret >= 0 ? "up" : "down") }, fmt.pct(v.ret)))),
      spark ? el("div", { class: "spark" }, spark) : null,
      el("div", { class: "grid" }, v.metrics.map(([k, x]) => el("div", null, el("div", { class: "lbl" }, k), el("div", { class: "v" }, x)))),
      rows.length ? el("table", null,
        el("thead", null, el("tr", null, ["position", "size", "value", "uPnL", "lev"].map((h) => el("th", null, h)))),
        el("tbody", null, rows.map((p) => el("tr", null,
          el("td", null, p.coin), el("td", { class: (p.size < 0 ? "down" : "up") }, fmt.num(p.size, 4)),
          el("td", null, fmt.usd(p.value)), el("td", { class: p.upnl < 0 ? "down" : "up" }, fmt.usd(p.upnl)),
          el("td", null, p.lev ? fmt.num(p.lev, 1) + "x" : "–"))))) : null,
      el("div", { class: "foot" }, "source " + (meta.source || "–") + " · as of " + (meta.asOf || "–") +
        (v.positions.length > rows.length ? " · " + (v.positions.length - rows.length) + " more positions" : "")),
    );
  }

  hlp.on("result", render);
  hlp.init({ name: "hlp-vault", version: "1" });
})();
</script>
</body>
</html>
